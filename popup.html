<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ABEMA Comment Analyzer</title>
<style>
body{font-family:system-ui,sans-serif;width:320px;margin:0;padding:16px;background:#111;color:#eee}h1{font-size:16px;margin:0 0 12px}.stat{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.card{background:#222;padding:10px;border-radius:8px}.n{font-size:22px;font-weight:700}.label{font-size:11px;color:#aaa}button{width:100%;padding:10px;margin-top:8px;border:0;border-radius:8px;cursor:pointer}#open{background:#fff;color:#111}#toggle{background:#333;color:#fff}#clear{background:#432;color:#fff}button:disabled{opacity:.55;cursor:wait}.ok{color:#9f9}.warn{color:#fc9}
</style>
</head>
<body>
<h1>ABEMA Comment Analyzer</h1>
<p id="backgroundStatus" style="font-size:12px;line-height:1.6"></p>
<div id="status">読み込み中…</div>
<div class="stat"><div class="card"><div class="n" id="count">0</div><div class="label">保存中のコメント</div></div><div class="card"><div class="n" id="users">0</div><div class="label">投稿者</div></div></div>
<button id="open">分析画面を開く</button>
<p id="captureDisclosure" style="font-size:12px;line-height:1.6;color:#ccc;margin:12px 0 6px">記録を開始すると、受信したコメント本文・投稿者ID・日時・ページ情報をこのChrome内に保存します。開発者への自動送信は行いません。</p>
<button id="toggle" disabled>記録状態を確認中…</button><button id="clear">コメント履歴を削除</button>
<div id="clearConfirm" hidden role="group" aria-label="コメント履歴の削除確認" style="border:1px solid #765;padding:10px;margin-top:8px;border-radius:8px">
  <p style="font-size:12px;line-height:1.6;margin:0">保存済みのコメント履歴を削除します。この操作は取り消せません。タグ・ミュート・番組設定は残ります。記録ONの場合は新しいコメントを引き続き保存します。</p>
  <button id="confirmClear" style="background:#744;color:#fff">履歴だけ削除する</button>
  <button id="cancelClear" style="background:#333;color:#fff">キャンセル</button>
</div>
<p id="clearStatus" role="status" aria-live="polite" style="font-size:12px"></p>
<p style="margin:12px 0 4px;font-size:13px"><a href="guide.html" target="_blank" rel="noopener noreferrer" style="color:#b6d0ff">はじめての使い方・データの取り扱い</a></p>
<div class="card" style="margin-top:12px"><div>通信取得の診断</div><div id="network" style="font-size:12px;white-space:pre-wrap;margin-top:8px">読み込み中…</div></div>
<script src="popup.js"></script>
</body></html>
