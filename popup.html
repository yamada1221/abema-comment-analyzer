<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ABEMA Comment Analyzer</title>
<style>
body{font-family:system-ui,sans-serif;width:320px;margin:0;padding:16px;background:#111;color:#eee}h1{font-size:16px;margin:0 0 12px}.stat{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.card{background:#222;padding:10px;border-radius:8px}.n{font-size:22px;font-weight:700}.label{font-size:11px;color:#aaa}button{width:100%;padding:10px;margin-top:8px;border:0;border-radius:8px;cursor:pointer}#open{background:#fff;color:#111}#toggle{background:#333;color:#fff}#clear{background:#432;color:#fff}.ok{color:#9f9}.warn{color:#fc9}
</style>
</head>
<body>
<h1>ABEMA Comment Analyzer</h1>
<div id="status">読み込み中…</div>
<div class="stat"><div class="card"><div class="n" id="count">0</div><div class="label">直近1時間のコメント</div></div><div class="card"><div class="n" id="users">0</div><div class="label">投稿者</div></div></div>
<button id="open">分析画面を開く</button><button id="toggle">記録を停止</button><button id="clear">1時間データを消去</button>
<script src="popup.js"></script>
</body></html>
